name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python packages
        run: pip install -r backend/requirements.txt -r dmb-automation/requirements.txt
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider
      - name: Test DMB worker
        working-directory: dmb-automation
        run: python -m pytest -q -p no:cacheprovider
      - name: Check Robot flow
        working-directory: dmb-automation
        env:
          DMB_USERNAME: dry-run-user
          DMB_PASSWORD: dry-run-password
        run: robot --dryrun --output NONE --log NONE --report NONE automation/create_album.robot automation/edit_album.robot
      - name: Check Compose file
        run: docker compose config --quiet
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check frontend
        working-directory: frontend
        run: npm run test && npm run lint && npm run build

  dmb-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build DMB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dmb-automation/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
